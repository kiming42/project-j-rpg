<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Project J：艾瑟瑞亞的破曉 (Dawn of Aetheria)</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app-container">

  <!-- ================= 0. 遊戲首頁封面 (Title Screen) ================= -->
  <div id="title-screen">
    <div class="title-sky-bg">
      <div class="title-emblem-box">
        <div class="title-sub">PROJECT J : PIXEL RESONANCE RPG</div>
        <h1 class="title-main">艾瑟瑞亞的破曉</h1>
        <div class="title-ver">DAWN OF AETHERIA v3.2</div>
      </div>
      <div class="title-hero-showcase" id="title-hero-preview"></div>
    </div>

    <div class="title-menu-panel">
      <button class="na-btn title-btn highlight" id="btn-continue-game" onclick="Aetheria.UI.continueGame()">
        繼續遊戲
        <span id="continue-save-info" class="title-save-sub">載入進度中...</span>
      </button>
      <button class="na-btn title-btn" onclick="Aetheria.UI.startNewGame()">
        新遊戲
        <span class="title-save-sub">由曙光營地展開全新冒險</span>
      </button>
    </div>
  </div>

  <!-- ================= 上半屏：極簡清爽像素舞台 (只保留單行頂欄，絕不遮擋地圖！) ================= -->
  <div id="upper-screen">
    <!-- 極簡單行 HUD：左邊紅心+Lv，右邊當前區域名稱 -->
    <div id="hud-overlay">
      <div class="hud-minimal-left">
        <span class="na-badge" id="hud-lv">Lv.1 蒼藍劍士</span>
      </div>
      <div class="hud-minimal-right">
        <span class="na-badge danger-safe" id="hud-zone">0. 曙光露營基地</span>
      </div>
    </div>

    <!-- 隱藏相容節點（供腳本更新資料並同步顯示於下半屏資訊欄） -->
    <div style="display:none;">
      <span id="hud-pet"></span>
      <span id="hud-guild"></span>
      <button id="btn-bgm-toggle"></button>
    </div>

    <!-- 主世界探索 Canvas -->
    <canvas id="world-canvas" width="256" height="144"></canvas>

    <!-- 洞穴火把視野遮罩 -->
    <div id="fog-overlay"></div>

    <!-- 純 HTML/CSS 戰鬥舞台 (零 Canvas、配搭開源像素圖資) -->
    <div id="battle-stage">
      <div class="bt-top-hud">
        <div class="bt-hero-status-card">
          <div class="bt-card-label">RESONATOR BP</div>
          <div class="bp-orbs" id="hero-bp-orbs"></div>
          <div class="bt-streak-pill" id="battle-streak-tag">連勝 x0</div>
        </div>

        <div class="bt-enemy-status-card">
          <div class="bt-enemy-header">
            <span id="enemy-name">翠風竹子妖 Lv.2</span>
            <span id="enemy-shiny-tag" class="bt-shiny-pill" style="display:none;">閃光</span>
          </div>
          <div class="bt-shield-weak-row">
            <div class="bt-shield-box" id="enemy-shield-box">
              <span class="css-diamond-shield"></span>
              <span id="enemy-shield">護盾 2</span>
            </div>
            <div class="bt-weak-pills" id="enemy-weak">弱點：忍刀 / 火遁</div>
          </div>
          <div class="hp-bar-outer">
            <div class="hp-bar-inner" id="enemy-hp-bar"></div>
          </div>
        </div>
      </div>

      <div class="bt-arena-field" id="bt-arena-bg">
        <div class="bt-scenery-horizon"></div>
        <div class="bt-platform bt-plat-left">
          <div class="bt-pet-slot" id="bt-dom-subpet"></div>
          <div class="bt-pet-slot" id="bt-dom-pet"></div>
          <div class="bt-hero-slot" id="bt-dom-hero"></div>
        </div>
        <div id="bt-slash-fx" class="bt-slash-effect"></div>
        <div class="bt-platform bt-plat-right">
          <div class="bt-enemy-slot" id="bt-dom-enemy"></div>
        </div>
      </div>
    </div>

    <!-- 浮動通知橫幅 -->
    <div id="toast-banner">系統提示</div>
  </div>

  <!-- ================= 下半屏：大字體清晰版掌機控制台 (54%) ================= -->
  <div id="lower-screen">

    <!-- 【面板 1】大世界探索控制台 -->
    <div id="panel-explore" class="sub-panel active">
      <!-- 頂部 6 大核心導航列 (配有像素小圖標 + 14px 大字體) -->
      <div class="quick-nav">
        <button class="na-btn highlight" id="nav-btn-map" onclick="Aetheria.UI.openWorldMapModal()">傳送</button>
        <button class="na-btn" id="nav-btn-guild" onclick="Aetheria.UI.openGuildModal()">公會</button>
        <button class="na-btn" id="nav-btn-forge" onclick="Aetheria.UI.openForgeModal('weapon')">鍛造</button>
        <button class="na-btn" id="nav-btn-bag" onclick="Aetheria.UI.openBagModal()">背包</button>
        <button class="na-btn" id="nav-btn-job" onclick="Aetheria.UI.openJobPetModal()">職/寵</button>
        <button class="na-btn" id="nav-btn-set" onclick="Aetheria.UI.openSettingsModal()">設定</button>
      </div>

      <!-- 整合後的清晰任務與釘選資訊羊皮紙框 (14px 大字體，移至下半屏不遮擋地圖！) -->
      <div id="explore-log">
        <div id="hud-quest" class="log-quest-line">主線：找營地鐵匠大叔・巴爾對話</div>
        <div id="pinned-recipe" class="log-pin-line">釘選：潮汐破盾忍刀 (藍晶鐵 2/5｜紅傘菇 2/3)</div>
      </div>

      <!-- 虛擬十字鍵 D-Pad + 右側動作鍵群 -->
      <div class="controls-pads">
        <div class="dpad">
          <div></div>
          <button class="dpad-btn" id="btn-up">▲</button>
          <div></div>
          <button class="dpad-btn" id="btn-left">◀</button>
          <button class="dpad-btn dpad-center" onclick="Aetheria.Explore.interactNearby()">調查</button>
          <button class="dpad-btn" id="btn-right">▶</button>
          <div></div>
          <button class="dpad-btn" id="btn-down">▼</button>
          <div></div>
        </div>

        <div class="action-cluster">
          <button class="btn-action-a" onclick="Aetheria.Explore.interactNearby()">
            <span class="action-main-txt">A 鍵</span>
            <span class="action-sub-txt" id="a-btn-hint">對話 / 採集</span>
          </button>
          <div style="display:flex; gap:6px;">
            <button class="na-btn" id="btn-use-bomb" style="padding:6px 10px;" onclick="Aetheria.Explore.useBomb()">炸彈</button>
            <button class="na-btn" style="padding:6px 10px;" onclick="Aetheria.Explore.warpToCamp()">回營地</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 【面板 2】NPC 互動對話面板 (大字體清晰版) -->
    <div id="panel-dialogue" class="sub-panel">
      <div class="dialogue-header">
        <canvas id="npc-portrait-canvas" width="40" height="40"></canvas>
        <div class="npc-title-box">
          <div id="npc-name-label" style="color:var(--na-gold); font-weight:900; font-size:16px;">鐵匠大叔・巴爾</div>
          <div id="npc-role-label" style="font-size:13px; color:#cbd5e1;">曙光營地首席武器師</div>
        </div>
        <button class="na-btn" style="margin-left:auto; padding:6px 12px;" onclick="Aetheria.UI.closePanelToExplore()">返回</button>
      </div>

      <div class="dialogue-scroll-box" id="npc-speech-text">對話載入中...</div>
      <div class="path-actions-title">選擇互動指令或專屬服務：</div>
      <div id="npc-action-buttons" class="npc-btn-grid"></div>
    </div>

    <!-- 【面板 3】戰鬥指令與 7 大題型詠唱面板 (16px 大字體清晰版) -->
    <div id="panel-battle" class="sub-panel">
      <div class="battle-cmd-header">
        <div style="display:flex; align-items:center; gap:6px;">
          <span style="color:var(--na-gold); font-weight:900; font-size:14px;" id="battle-phase-title">符文破盾詠唱</span>
          <span id="timer-badge" style="display:none;">12s</span>
        </div>
        <div style="display:flex; gap:5px;">
          <button class="na-btn" id="btn-boost" onclick="Aetheria.Battle.toggleBoost()">Boost</button>
          <button class="na-btn" id="btn-tame" style="display:none; border-color:#5ac54f;" onclick="Aetheria.Battle.attemptTame()">收服</button>
          <button class="na-btn" onclick="Aetheria.Battle.useHealPotion()">藥水</button>
          <button class="na-btn" onclick="Aetheria.Battle.fleeBattle()">撤退</button>
        </div>
      </div>

      <div class="quiz-scroll-box">
        <div class="quiz-meta">
          <span id="q-subject-tag">[中文・龍語古卷]</span>
          <span id="q-type-tag">四選一・疾風連斬</span>
        </div>
        <div class="quiz-prompt" id="q-prompt-text">題目載入中...</div>
        <div id="q-diagram-container" class="quiz-diagram-thumb" style="display:none;" onclick="Aetheria.QuizUI.openLightbox()">
          <div id="q-diagram-svg"></div>
          <span style="font-size:12px; color:var(--na-gold);">[點擊放大檢視圖卷]</span>
        </div>
      </div>

      <div id="quiz-interactive-area"></div>
    </div>

    <!-- 【面板 4】多功能系統視窗 (14px~15px 大字體清晰版) -->
    <div id="panel-modal" class="sub-panel">
      <div class="modal-header-bar">
        <h3 id="modal-title">系統選單</h3>
        <button class="na-btn" style="padding:5px 12px;" onclick="Aetheria.UI.closePanelToExplore()">返回探索</button>
      </div>
      <div id="modal-body" class="modal-content-scroll"></div>
    </div>

  </div>

  <!-- 圖片全屏放大燈箱 -->
  <div id="image-lightbox" onclick="Aetheria.QuizUI.closeLightbox()">
    <div style="color:var(--na-gold); font-weight:900; font-size:16px; margin-bottom:10px;">古文明圖卷（點擊任意處關閉）</div>
    <div id="lightbox-content"></div>
  </div>
</div>

<!-- 5 層解耦模組載入順序 -->
<script src="js/engine/save-state.js"></script>
<script src="js/engine/audio-synth.js"></script>
<script src="js/data/pixel-sprites.js"></script>
<script src="js/data/world-maps.js"></script>
<script src="js/data/items-crafting.js"></script>
<script src="js/data/jobs-monsters.js"></script>
<script src="js/data/quests-npcs.js"></script>
<script src="questions/question-bridge.js"></script>
<script src="js/engine/camera-renderer.js"></script>
<script src="js/systems/exploration-gather.js"></script>
<script src="js/systems/quiz-widgets.js"></script>
<script src="js/systems/battle-break-boost.js"></script>
<script src="js/systems/progression-town.js"></script>

</body>
</html>
